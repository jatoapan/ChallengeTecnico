# Nginx sirve el Angular compilado y reenvía /api (y /swagger) a la API.
# La API no se publica fuera de Docker: toda petición externa entra por Caddy y luego por aquí.

# Protocolo original de la petición (Caddy lo informa en X-Forwarded-Proto; sin Caddy, el de esta conexión).
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Detrás de Caddy: la IP real del visitante llega en X-Forwarded-For. Solo se confía en esa cabecera
    # cuando viene de la red interna de Docker (rangos privados); nadie de fuera puede falsificarla.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # "^~" hace que estas rutas ganen sobre la regla de archivos estáticos (.js, .css) de más abajo.
    # Sin él, /swagger/swagger-ui-bundle.js se buscaría en el disco del front y daría 404.

    # API REST: se pasa la IP real del usuario para que la auditoría la registre.
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $proto_original;
    }

    # Swagger (solo responde si Swagger__Habilitado=true en la API)
    location ^~ /swagger {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $proto_original;
    }

    # Archivos con hash en el nombre: se pueden cachear mucho tiempo.
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Aplicación Angular: cualquier ruta devuelve index.html (el router resuelve la pantalla).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
