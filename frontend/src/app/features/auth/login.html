<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light p-3">
  <div class="card shadow-sm w-100" style="max-width: 400px">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-box-seam fs-1 text-primary"></i>
        <h1 class="h4 mt-2">Inventario de Productos</h1>
        <p class="text-muted mb-0">Inicie sesión para continuar</p>
      </div>

      <form [formGroup]="formulario" (ngSubmit)="ingresar()" novalidate>
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input id="usuario" type="text" class="form-control" formControlName="usuario"
                 autocomplete="username"
                 [class.is-invalid]="formulario.controls.usuario.invalid && formulario.controls.usuario.touched">
          <div class="invalid-feedback">El usuario es obligatorio.</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group has-validation">
            <input id="password" class="form-control" formControlName="password"
                   autocomplete="current-password"
                   [type]="verClave() ? 'text' : 'password'"
                   [class.is-invalid]="formulario.controls.password.invalid && formulario.controls.password.touched">
            <button type="button" class="btn btn-outline-secondary"
                    aria-label="Mostrar u ocultar contraseña"
                    (click)="verClave.set(!verClave())">
              <i class="bi" [class.bi-eye]="!verClave()" [class.bi-eye-slash]="verClave()"></i>
            </button>
            <div class="invalid-feedback">La contraseña es obligatoria.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Iniciar sesión
        </button>
      </form>
    </div>
  </div>
</div>
